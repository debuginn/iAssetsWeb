baseURL = 'https://iassets.debuginn.com/'
title = 'iAssets'
theme = 'pebble'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = true
disableKinds = ['taxonomy', 'term', 'RSS']
enableRobotsTXT = true

[permalinks.page]
  activities = '/act/:contentbasename/'

[module]
  [module.hugoversion]

  [[module.mounts]]
    source = 'package.json'
    target = 'assets/_jsconfig/package.json'

  [[module.mounts]]
    lang = 'en'
    source = 'content/en'
    target = 'content'

  [[module.mounts]]
    lang = 'zh'
    source = 'content/zh'
    target = 'content'

